<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="A local, visual home for your favorite links." />
    <title>Orbit — your personal link galaxy</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="links-data.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Return to Galaxy">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>orbit<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-right">
          <span class="local-badge"><span class="status-dot"></span> LOCAL LINK MAP</span>
          <span id="link-count" class="link-count"></span>
          <button id="settings-trigger" class="settings-trigger" type="button" aria-label="Open menu" title="Open menu" hidden>⚙</button>
        </div>
      </header>

      <main id="app" aria-live="polite"></main>

      <footer class="footer">
        <span>Made for the links you keep coming back to.</span>
        <span>Use Settings → Edit links to make this yours.</span>
      </footer>
    </div>

    <div id="menu-overlay" class="menu-overlay" hidden>
      <button id="menu-scrim" class="menu-scrim" type="button" aria-label="Close menu"></button>
      <section class="menu-sheet" aria-label="Orbit menu">
        <div class="menu-top">
          <div>
            <p class="eyebrow">ORBIT</p>
            <h2>Explore the menu</h2>
          </div>
          <button id="menu-close" class="menu-close" type="button" aria-label="Close menu">×</button>
        </div>
        <div class="menu-options">
          <button class="menu-option" type="button" data-menu-panel="Settings">Settings</button>
          <button class="menu-option" type="button" data-menu-panel="Help">Help</button>
          <button class="menu-option" type="button" data-menu-panel="About">About</button>
        </div>
        <div id="menu-content" class="menu-content"></div>
      </section>
    </div>
  </body>
</html>
